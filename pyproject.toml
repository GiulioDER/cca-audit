[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-audit"
version = "0.10.0"
description = "Multi-agent code audit for Claude Code and Codex in which no unverified finding enters the fix plan"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giulio D'Erme" }]
keywords = ["static-analysis", "code-review", "verification", "claude-code", "codex", "llm", "ai-code-review", "code-audit"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

[project.scripts]
# The reason `pip install cca-audit` is worth anything: it puts the plugin
# installer on PATH, so the whole product arrives in one command instead of a
# clone plus a shell script piped from the network.
cca-audit = "cca_checks.plugin.cli:main"

[project.urls]
Homepage = "https://github.com/GiulioDER/cca-audit"
Repository = "https://github.com/GiulioDER/cca-audit"
Issues = "https://github.com/GiulioDER/cca-audit/issues"

[project.optional-dependencies]
# pytest belongs in `numeric`, not just hypothesis: the numeric claim type runs its
# generated property file THROUGH pytest, so installing hypothesis alone leaves
# every numeric claim escalating to UNCERTAIN -- and on the DEEP tier a NUM-* P1
# cannot be fixed at all without a hypothesis artifact. An extra that half-enables
# a feature is worse than one that does not exist, because the failure is silent.
numeric = ["hypothesis>=6.165.10", "pytest>=9.1.1", "mpmath>=1.3"]
# The Rust backend's PARSER. Not its diagnostics: `panic_path`, `overflow`,
# `error_swallow` and `unsafe_op` are settled by clippy, which is part of the target's
# own toolchain and cannot be pip-installed. Splitting them is deliberate -- a grammar
# wheel always works, so `clock_leak` and enclosing-span resolution keep working on a
# crate that does not build, which is exactly when an auditor most needs them.
rust = ["tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
# The deterministic layer, minus semgrep. See `taint` below for why that one is
# not here: this extra goes into a user's working environment, and must not be
# able to rewrite packages that have nothing to do with auditing.
verify = ["hypothesis>=6.165.10", "pytest>=9.1.1", "pyright>=1.1.411", "mpmath>=1.3",
          "tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
# SEMGREP IS DELIBERATELY NOT IN `verify`, AND THIS IS NOT AN OVERSIGHT.
#
# `cca_checks` never imports semgrep. It resolves it on PATH and spawns it
# (`semgrep_check.py` -> `resolve_tool("semgrep")` -> `subprocess.run`), exactly
# like cargo, which nobody would think to pip-install. So it is a TOOL, and it
# only ever sat in a pip extra because "one install" read as tidy.
#
# It is not tidy, it is destructive. semgrep hard-pins `mcp==1.29.0`,
# `ruamel.yaml.clib==0.2.15` and `pywin32==311`, so `pip install cca-audit[verify]`
# silently downgraded a user's `mcp` from 2.1.0 to 1.29.0 on 2026-08-31, breaking
# unrelated MCP tooling to satisfy a dependency the audit layer never imports.
# An extra that rewrites packages outside its own concern is a bug in the extra.
#
# `pipx install semgrep` is the right install: isolated environment, binary on
# PATH, which is all `resolve_tool` ever wanted. This extra exists for the case
# where in-environment really is preferred, so the pins are accepted knowingly
# rather than discovered afterwards.
#
# Removing it from `verify` would once have been the "extra that half-enables a
# feature" mistake warned about above, silently. It is not silent any more:
# `unavailable_claim_types` probes by EXECUTION since the same day, so a missing
# or unrunnable semgrep is reported by `cca_checks capabilities` with its reason,
# and every taint claim escalates visibly instead of being quietly skipped.
taint = ["semgrep>=1.175.0"]
# mpmath belongs here for the same reason pytest belongs in `numeric`: CI installs
# `.[dev]`, and both tests/test_substrate.py and tests/acceptance/test_substrate_suite.py
# `pytest.importorskip("mpmath")` at module scope -- without it here, ~25 substrate
# tests (including the integrity gate, the feature's central safety guarantee) skip
# on every CI run instead of executing, and a regression there merges with green CI.
# tree-sitter belongs here for exactly the reason mpmath does: tests/test_treesitter.py
# and tests/test_clock_check_rust.py `pytest.importorskip` it at module scope, and CI
# installs `.[dev]` -- so without it here the entire Rust parsing layer would skip
# silently on every CI run and a regression in it would merge green.
# test_dev_extra_completeness.py asserts this invariant rather than this list.
# tomli only on 3.10: tests/test_extras_do_not_repin_the_environment.py reads
# this file, and `tomllib` landed in 3.11 while `requires-python` is >=3.10.
# The marker keeps it off every other interpreter rather than shipping a
# backport nobody there imports.
dev = ["hypothesis>=6.165.10", "pytest>=9.1.1", "ruff>=0.16.5", "mpmath>=1.3",
       "tree-sitter>=0.23", "tree-sitter-rust>=0.23",
       "tomli>=2.0; python_version < '3.11'"]

[tool.setuptools.packages.find]
# Glob, not a hand-maintained list: a literal `packages = ["cca_checks"]` silently
# drops any future subpackage from the wheel, and that failure surfaces only as an
# ImportError in installed use -- never in a repo-root test run.
include = ["cca_checks*"]

[tool.setuptools.package-data]
cca_checks = ["rules/*.yaml"]
# The agent and command markdown IS the product -- a wheel without it installs
# cleanly and produces an empty .claude/, which no import smoke-test can see.
# tests/test_plugin_install.py asserts every file on disk is reachable as a
# package resource, so this glob cannot silently stop matching.
# tools/*.py ships for the same reason: the orchestrator shells out to the two
# checkers BY PATH, so a wheel without them installs cleanly and then reports no
# scorecard and no red-state proof, with the gates failing as "command not found".
"cca_checks.plugin" = [
  "agents/*.md",
  "commands/*.md",
  "tools/*.py",
  "hooks/*.py",
  "codex/cca-audit/SKILL.md",
  "codex/cca-audit/agents/*.yaml",
]

[tool.pytest.ini_options]
# cca_checks/plugin/tools is a testpath, not a stray directory: those two checkers
# gate the audit pipeline itself (Step 2.6 and Step 5.6), so a regression there is
# a regression in what /audit-fix is willing to confirm. Their tests import the
# modules as bare siblings, which is why they live beside them rather than under
# tests/ -- and why that directory deliberately has no __init__.py.
testpaths = ["tests", "cca_checks/plugin/tools"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# tests/fixtures/ is sample code that is deliberately imperfect, and its LINE
# NUMBERS are part of the test contract -- the suite settles claims at specific
# coordinates in these files. Auto-formatting them silently moves the defect: a
# `ruff --fix` pass rewrote `Optional[Card]` to `Card | None`, dropped the
# now-unused import, shifted every line up by one, and turned a CONFIRMED
# acceptance test into an UNCERTAIN. Never lint the fixtures.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# E731: tests use short throwaway lambdas as stand-in callables; a def per stub
#       would obscure more than it clarifies.
# E501: several fixtures embed VERBATIM pyright/Hypothesis output, which the
#       parsers under test match against. Reflowing them to satisfy a line-length
#       rule would change the data the assertion depends on.
"tests/*" = ["E731", "E501"]

[tool.pyright]
# A tool whose product is "pyright as evidence" should pass its own check.
include = ["cca_checks"]
typeCheckingMode = "standard"
